name: AI Auto Fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run AI fixer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python ai_fixer.py

      - name: Run tests
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f pytest.ini ] || [ -d tests ]; then
            pytest
          else
            python -m compileall .
          fi

      - name: Commit fixes
        run: |
          git config user.name "PRReviewer Bot"
          git config user.email "prreviewer-bot@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-fix issues detected in PR"
            git push
          fi
